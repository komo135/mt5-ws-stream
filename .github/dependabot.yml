version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["ruff", "mypy", "pytest*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # upload-artifact and download-artifact should move together: CI uploads
      # `dist` and Release downloads it, so a lone major bump on either side
      # changes one half of that handoff.
      artifact-actions:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
