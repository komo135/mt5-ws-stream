name: Release

# Releases are cut by pushing a `vX.Y.Z` tag -- never by merging to main.
# `on: push: branches` deliberately does not appear anywhere in this file.
#
# The path a release has to walk:
#
#   1. guard    -- the tag matches pyproject, points at a commit on main, and
#                  CHANGELOG.md has a section for it. Cheap, and fails first.
#   2. ci       -- the full CI workflow re-runs on the tagged tree. A tag can
#                  only publish code that has just gone green, not code that
#                  was green on some earlier commit.
#   3. publish  -- gated on the `pypi` environment. Give that environment a
#                  required reviewer and this step waits for a human to press
#                  approve; nothing reaches PyPI without it.
#   4. github-release -- only after PyPI accepted the upload.
#
# `workflow_dispatch` runs 1-3 against TestPyPI so the whole path, including
# Trusted Publishing, can be rehearsed without burning a real version number.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        default: testpypi
        options: [testpypi, none]

permissions:
  contents: read

concurrency:
  # Distinct from the group the called CI workflow declares, so the two never
  # queue against each other inside the same run.
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git merge-base --is-ancestor` needs the branch history, not just the tag.
          fetch-depth: 0

      - name: Read the package version
        id: version
        run: |
          PKG=$(python3 -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $PKG"

      - name: The tag must match the package version
        if: github.event_name == 'push'
        env:
          PKG: ${{ steps.version.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: The tagged commit must be on main
        if: github.event_name == 'push'
        # A tag pushed from a feature branch would otherwise publish code that
        # never survived review. Reachability, not equality: tagging an older
        # commit on main is a legitimate patch release.
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main -- refusing to release off-branch"
            exit 1
          fi

      - name: CHANGELOG.md must have a section for this version
        env:
          PKG: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -qE "^## \[$PKG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PKG]' section"
            exit 1
          fi

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to ${{ github.event_name == 'push' && 'PyPI' || inputs.target }}
    needs: [guard, ci]
    if: github.event_name == 'push' || inputs.target != 'none'
    runs-on: ubuntu-latest
    environment:
      # Put a required reviewer on this environment: it is the manual approval
      # gate, and the only thing standing between a pushed tag and PyPI.
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/mt5-ws-stream' || 'https://test.pypi.org/p/mt5-ws-stream' }}
    permissions:
      id-token: write   # Trusted Publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Built and smoke-tested by the CI workflow above; never rebuilt here,
          # so what PyPI receives is the artifact CI actually exercised.
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    name: github release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
